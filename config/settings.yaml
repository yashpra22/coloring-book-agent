# ═══════════════════════════════════════════════════════════
#  Daily Coloring Book Agent - Configuration
# ═══════════════════════════════════════════════════════════

book:
  pages: 100                    # Number of coloring pages (excludes cover)
  include_cover: true           # Generate a cover page
  page_size: "A4"               # A4 = 210x297mm
  dpi: 300                      # Print quality
  margin_mm: 15                 # Safe margin for binding/printing

# ── Free API Providers ───────────────────────────────────
apis:
  # OpenRouter — free LLM for creative prompt generation
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"
    fallback_models: []
    max_tokens: 4096
    temperature: 0.9

  # Cloudflare Workers AI — free tier (10,000 neurons/day), reliable
  cloudflare:
    model: "@cf/bytedance/stable-diffusion-xl-lightning"
    width: 1024
    height: 1024
    num_steps: 8
    guidance: 7.5

  # NVIDIA NIM — free tier with API key (needs function enabled on account)
  nvidia:
    base_url: "https://ai.api.nvidia.com/v1/genai/stabilityai/stable-diffusion-xl"
    model: "stabilityai/stable-diffusion-xl"
    width: 1024
    height: 1024
    steps: 30
    cfg_scale: 5
    sampler: "K_DPM_2_ANCESTRAL"

  # Hugging Face Inference Providers — free tier with token
  huggingface:
    base_url: "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell"
    model: "black-forest-labs/FLUX.1-schnell"
    provider: "auto"
    width: 1024
    height: 1024
    steps: 30
    guidance_scale: 7.5

# ── Image Generation Pipeline ────────────────────────────
generation:
  # Order of image providers (primary → fallback → fallback)
  provider_priority:
    - "cloudflare"
    - "nvidia"
    - "huggingface"
  max_retries: 3                # Retries per image
  retry_delay: 5                # Seconds between retries
  batch_size: 10                # Process in batches (progress logging)
  concurrent: 2                 # Parallel API calls (avoid rate limits)

# ── Prompt Strategy ──────────────────────────────────────
prompts:
  # Negative prompts appended to every page prompt
  negative_prompt: "color, shading, gradient, photorealistic, 3d, complex, blurry, low quality, watermark, text, letters, words"
  # Style suffix for coloring pages (black & white line art)
  page_style_suffix: "clean black and white line art, bold thick outlines, pure white background, simple vector style, kids coloring book page, no shading, no color, high contrast, minimal detail"
  # Style suffix for cover page
  cover_style_suffix: "kids coloring book cover illustration, bold black outlines, decorative border frame, white background, line art, no color, kid-friendly, cheerful"

# ── Post-Processing ──────────────────────────────────────
processing:
  resize_to_a4: true
  enhance_contrast: true
  contrast_factor: 1.5
  sharpen: true
  convert_to_grayscale: true
  # Line art enhancement via OpenCV
  apply_canny: true
  canny_threshold1: 50
  canny_threshold2: 150
  canny_blur_kernel: 3
  # Dilate lines for cleaner print
  dilate_lines: true
  dilate_kernel_size: 1

# ── Output Paths ─────────────────────────────────────────
paths:
  output_raw: "output/raw"           # Downloaded raw images
  output_processed: "output/processed"  # Post-processed line art
  output_books: "output/books"       # Final PDFs
  output_prompts: "output/prompts"   # Saved prompt JSON
  logs: "logs"

# ── Book Metadata ────────────────────────────────────────
metadata:
  author: "AI Coloring Book Agent"
  publisher: "Daily Kids Coloring"
  series: "Daily Creative Coloring Series"

# ── Logging ──────────────────────────────────────────────
logging:
  level: "INFO"
  rotation: "7 days"
  retention: "30 days"
