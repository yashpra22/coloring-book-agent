# ═══════════════════════════════════════════════════════════
#  Daily Coloring Book Agent - Configuration
# ═══════════════════════════════════════════════════════════

book:
  pages: 100                    # Number of coloring pages (excludes cover)
  include_cover: true           # Generate a cover page
  page_size: "A4"               # A4 = 210x297mm
  dpi: 300                      # Print quality
  margin_mm: 15                 # Safe margin for binding/printing

# ── Free API Providers ───────────────────────────────────
apis:
  # OpenRouter — free LLM for creative prompt generation
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"
    fallback_models: []
    max_tokens: 4096
    temperature: 0.9

  # Pollinations.ai — 100% FREE, no key needed (fallback, no key required)
  pollinations:
    model: "flux"
    width: 1024
    height: 1024

  # Cloudflare Workers AI — PRIMARY (free 10,000 neurons/day, best quality)
  # NOTE: SDXL-Lightning supports max 8 steps; quality comes from
  # guidance 3.5 + stronger line-art prompts, not num_steps.
  cloudflare:
    model: "@cf/bytedance/stable-diffusion-xl-lightning"
    width: 1024
    height: 1024
    num_steps: 8
    guidance: 3.5

  # NVIDIA NIM — free tier with API key (needs function enabled on account)
  nvidia:
    base_url: "https://ai.api.nvidia.com/v1/genai/stabilityai/stable-diffusion-xl"
    model: "stabilityai/stable-diffusion-xl"
    width: 1024
    height: 1024
    steps: 30
    cfg_scale: 5
    sampler: "K_DPM_2_ANCESTRAL"

  # Hugging Face Inference Providers — free tier with token
  huggingface:
    base_url: "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell"
    model: "black-forest-labs/FLUX.1-schnell"
    provider: "auto"
    width: 1024
    height: 1024
    steps: 30
    guidance_scale: 7.5

# ── Image Generation Pipeline ────────────────────────────
generation:
  # Order of image providers (primary → fallbacks)
  # CURRENTLY: only Cloudflare is active.
  # Pollinations / NVIDIA / HuggingFace code + config are KEPT for future
  # (uncomment to re-enable as fallback if they offer a good image model).
  provider_priority:
    - "cloudflare"
    # - "pollinations"
    # - "nvidia"
    # - "huggingface"
  max_retries: 3                # Retries per image
  retry_delay: 5                # Seconds between retries

# ── Prompt Strategy ──────────────────────────────────────
prompts:
  # Negative prompts appended to every page prompt
  negative_prompt: "color, colours, colored, shading, gradient, shadow, photorealistic, photo, 3d render, cgi, painting, watercolor, sketchy, pencil sketch, messy lines, broken lines, thin lines, faint lines, complex background, cluttered, blurry, low quality, watermark, text, letters, words, signature, grey fill, grey wash, dark background"
  # Style suffix for coloring pages (black & white line art)
  page_style_suffix: "children's coloring book page, simple bold black line art on pure white background, thick uniform outlines 3-5px, single centered subject, minimal geometric background shapes, large open white areas to color, flat 2D cartoon, no shading, no crosshatching, no gradients, no grey tones, no color"
  # Style suffix for cover page
  cover_style_suffix: "children's coloring book cover, simple bold black line art on pure white background, thick uniform outlines 3-5px, one large centered illustration, decorative rectangular border frame, minimal background shapes, large open white areas to color, flat 2D cartoon, no shading, no gradients, no grey tones, no color, kid-friendly, cheerful"

# ── Post-Processing ──────────────────────────────────────
# NOTE: SDXL-Lightning already returns line art; threshold too aggressive
# hota hai (detail kha jata hai) isliye default OFF — sirf soft contrast +
# sharpen + A4 resize hota hai. Agar model grey/shaded image de to
# clean_background: true kar do.
processing:
  enhance_contrast: true
  contrast_factor: 1.2
  sharpen: true
  # Optional: grey wash hatane ke liye adaptive threshold (default OFF)
  clean_background: false
  threshold_block_size: 71
  threshold_c: 10
  # Optional: patli lines moti karne ke liye (default OFF)
  dilate_lines: false
  dilate_kernel_size: 2

# ── Output Paths ─────────────────────────────────────────
paths:
  output_raw: "output/raw"           # Downloaded raw images
  output_processed: "output/processed"  # Post-processed line art
  output_books: "output/books"       # Final PDFs
  output_prompts: "output/prompts"   # Saved prompt JSON
  logs: "logs"

# ── Book Metadata ────────────────────────────────────────
metadata:
  author: "AI Coloring Book Agent"
  publisher: "Daily Kids Coloring"
  series: "Daily Creative Coloring Series"

# ── Logging ──────────────────────────────────────────────
logging:
  level: "INFO"
  rotation: "7 days"
  retention: "30 days"
