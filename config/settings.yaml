# ═══════════════════════════════════════════════════════════
#  Daily Coloring Book Agent - Configuration
# ═══════════════════════════════════════════════════════════

book:
  pages: 100                    # Number of coloring pages (excludes cover)
  include_cover: true           # Generate a cover page
  page_size: "A4"               # A4 = 210x297mm
  dpi: 300                      # Print quality
  margin_mm: 15                 # Safe margin for binding/printing

# ── Free API Providers ───────────────────────────────────
apis:
  # OpenRouter — free LLM for creative prompt generation
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"
    fallback_models: []
    max_tokens: 4096
    temperature: 0.9

  # Pollinations.ai — 100% FREE, no key needed (fallback, no key required)
  pollinations:
    model: "flux"
    width: 1024
    height: 1024

  # Cloudflare Workers AI — PRIMARY (free 10,000 neurons/day, best quality)
  #
  # VERIFIED LIVE against api.cloudflare.com — each model accepts a DIFFERENT
  # request schema, and anything outside the model's list is rejected with
  # HTTP 400 "Additional or unevaluated properties ... not allowed".
  #
  #   flux-1-schnell              -> ONLY {prompt, steps(max 8, default 4)}
  #                                  Always renders 1024x1024. Ignores seed, so
  #                                  output is NOT reproducible, and negative
  #                                  guidance must live inside the prompt text
  #                                  (prompt_agent already appends "Avoid: ...").
  #   stable-diffusion-xl-lightning-> {prompt, negative_prompt, height, width,
  #                                    num_steps(max 20), guidance, seed}
  #
  # `model_params` maps each model to the fields image_agent is allowed to send.
  cloudflare:
    model: "@cf/black-forest-labs/flux-1-schnell"
    steps: 8
    max_prompt_chars: 2047        # FLUX prompt maxLength is 2048
    model_params:
      "@cf/black-forest-labs/flux-1-schnell":
        - "prompt"
        - "steps"
      "@cf/bytedance/stable-diffusion-xl-lightning":
        - "prompt"
        - "negative_prompt"
        - "height"
        - "width"
        - "num_steps"
        - "guidance"
        - "seed"
    # Only read when the model is swapped to SDXL-Lightning:
    width: 1024
    height: 1024
    num_steps: 8
    guidance: 3.5

  # NVIDIA NIM — free tier with API key (needs function enabled on account)
  nvidia:
    base_url: "https://ai.api.nvidia.com/v1/genai/stabilityai/stable-diffusion-xl"
    model: "stabilityai/stable-diffusion-xl"
    width: 1024
    height: 1024
    steps: 30
    cfg_scale: 5
    sampler: "K_DPM_2_ANCESTRAL"

  # Hugging Face Inference Providers — free tier with token
  huggingface:
    base_url: "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell"
    model: "black-forest-labs/FLUX.1-schnell"
    provider: "auto"
    width: 1024
    height: 1024
    steps: 30
    guidance_scale: 7.5

# ── Image Generation Pipeline ────────────────────────────
generation:
  # Order of image providers (primary → fallbacks)
  # Cloudflare primary (best quality); Pollinations = free no-key fallback
  # jo Cloudflare ke daily neurons khatam hone par catch karta hai.
  provider_priority:
    - "cloudflare"
    - "pollinations"
    # - "nvidia"
    # - "huggingface"
  max_retries: 3                # Retries per image
  retry_delay: 5                # Seconds between retries

# ── Prompt Strategy ──────────────────────────────────────
# FLUX-schnell accepts NO negative_prompt field, so `negative_prompt` is only
# used as the "Avoid: ..." tail that prompt_agent appends to the prompt text,
# and for the providers that do accept it (SDXL-Lightning).
prompts:
  # Negative prompts appended to every page prompt
  negative_prompt: "color, colours, colored, shading, shadow, gradient, stipple dots, stippling, noise, texture, fur detail, crosshatching, hatching, heavy black fills, photorealistic, photo, 3d render, cgi, painting, watercolor, sketchy, pencil sketch, messy lines, broken lines, thin lines, faint lines, blurry, low quality, watermark, text, letters, words, signature, grey fill, grey wash, dark background"
  # Style suffix for coloring pages (Round-5: tuned to match ChatGPT reference —
  # VERY thick outlines, simple composition, large closed colorable regions).
  # FLUX renders 1024x1024 and the A4 crop trims the sides, so the prompt asks
  # for a tall portrait composition that survives centre-cropping.
  page_style_suffix: "children's coloring book page, extremely thick bold uniform black outlines at least 8 pixels wide, very simple minimal composition with only 2 large subjects, each subject drawn HUGE filling most of the page, large simple closed shapes that are easy to color, cute kawaii chibi characters with big round eyes and happy smiles, clean smooth unbroken outlines, generous empty white space between elements, every shape EMPTY WHITE INSIDE with white fill, no background details, plain white background, flat 2D cartoon, no shading, no texture, no fur, no stippling, no crosshatching, no gradients, no grey tones, no color, no solid black areas"
  # Style suffix for cover page
  cover_style_suffix: "vertical portrait children's coloring book cover, simple bold black line art on pure white background, thick uniform outlines, one large centered illustration, decorative rectangular border frame, minimal background shapes, large open white areas to color, every shape EMPTY WHITE INSIDE, flat 2D cartoon, no shading, no stippling, no gradients, no grey tones, no color, kid-friendly, cheerful"
  # Full-COLOR cover style (ChatGPT-reference look): vibrant colour art, NO text —
  # the title/subtitle are overlaid by ProcessAgent with PIL because
  # FLUX-schnell cannot render text reliably.
  cover_color_style_suffix: "vibrant colorful children's picture book cover illustration, flat 2D kawaii cartoon style, bright saturated cheerful colors, soft pastel sky background with fluffy clouds, several cute chubby animal characters with big sparkly eyes grouped together smiling and waving, simple rounded shapes, clean vector-like storybook art, full color, rich detail, no text, no letters, no words, no watermark"

# ── Post-Processing ──────────────────────────────────────
# Round-4 winning recipe for FLUX-schnell output (see output/review4/):
# contrast 1.2 + sharpen + binary threshold + speckle removal, then A4 crop.
# FLUX leaves stray stipple/dither pixels in the white areas; `speckle_min_area`
# deletes any connected black component smaller than N px, which is what
# actually fixed the artifacts. Keep this ON for FLUX.
processing:
  enhance_contrast: true
  contrast_factor: 1.2
  sharpen: true
  # Global binary threshold (200 = anything lighter than this becomes pure white)
  clean_background: true
  threshold_value: 200
  # Remove isolated stipple dots / anti-aliasing noise after thresholding
  speckle_removal: true
  speckle_min_area: 12
  # Adaptive threshold (older SDXL path) — only used if threshold_mode: adaptive
  threshold_block_size: 71
  threshold_c: 10
  # Optional: patli lines moti karne ke liye — ON to match the thick-outline
  # ChatGPT reference style (thin FLUX lines get expanded by this kernel).
  dilate_lines: true
  dilate_kernel_size: 2

# ── Color Cover Overlay ──────────────────────────────────
# Title text PIL se draw hota hai (FLUX text render nahi kar sakta).
# Fonts Windows-standard hain; title reference jaisa warm orange + white outline.
cover:
  subtitle: "COLORING BOOK"
  title_font: "C:/Windows/Fonts/comicbd.ttf"    # Comic Sans MS Bold
  subtitle_font: "C:/Windows/Fonts/arialbd.ttf" # Arial Bold
  title_fill: [255, 140, 30]                    # warm orange (reference jaisa)
  title_stroke: [255, 255, 255]                 # white outline
  subtitle_fill: [255, 255, 255]
  subtitle_bg: [66, 133, 244]                   # blue ribbon
  title_band_ratio: 0.24                        # top % of page for the title
  saturation: 1.15                              # colour boost
  contrast: 1.05

# ── Output Paths ─────────────────────────────────────────
paths:
  output_raw: "output/raw"           # Downloaded raw images
  output_processed: "output/processed"  # Post-processed line art
  output_books: "output/books"       # Final PDFs
  output_prompts: "output/prompts"   # Saved prompt JSON
  logs: "logs"

# ── Book Metadata ────────────────────────────────────────
metadata:
  author: "AI Coloring Book Agent"
  publisher: "Daily Kids Coloring"
  series: "Daily Creative Coloring Series"

# ── Logging ──────────────────────────────────────────────
logging:
  level: "INFO"
  rotation: "7 days"
  retention: "30 days"
